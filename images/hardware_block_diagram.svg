<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">CyberRod Hardware Block Diagram</title>
  <desc id="desc">Block diagram showing the SiWx917 development board connected to sensors, actuators, power, debug, Wi-Fi, MQTT, Node-RED, and HTTP OTA services.</desc>

  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #102033; }
      .subtitle { font: 400 16px Arial, Helvetica, sans-serif; fill: #52657a; }
      .section { fill: #ffffff; stroke: #c9d6e2; stroke-width: 2; rx: 18; }
      .mcu { fill: #12324a; stroke: #0b2234; stroke-width: 3; rx: 20; }
      .sensor { fill: #e8f5ff; stroke: #4d9bd8; stroke-width: 2; rx: 14; }
      .actuator { fill: #fff4e2; stroke: #e09b2d; stroke-width: 2; rx: 14; }
      .cloud { fill: #edf7ef; stroke: #5aa86a; stroke-width: 2; rx: 14; }
      .power { fill: #f2edff; stroke: #8b6ed8; stroke-width: 2; rx: 14; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #17283a; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #40566b; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #52657a; }
      .whiteLabel { font: 700 24px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .whiteSmall { font: 400 15px Arial, Helvetica, sans-serif; fill: #d9e8f5; }
      .bus { stroke: #34495e; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .wire { stroke: #607d95; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .wifi { stroke: #2d8f55; stroke-width: 3; fill: none; marker-end: url(#greenArrow); stroke-dasharray: 9 7; }
      .note { fill: #ffffff; stroke: #d8e2ec; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34495e"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2d8f55"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="700" y="52" text-anchor="middle">CyberRod Hardware Setup Block Diagram</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">Combined view of wifi_http_otaf_soc and 917_devboard as one SiWx917-based IoT fishing rod device</text>

  <rect class="section" x="42" y="120" width="398" height="600"/>
  <text class="label" x="66" y="154">Sensor Inputs</text>
  <text class="tiny" x="66" y="176">Physical measurements from the rod and water</text>

  <rect class="sensor" x="78" y="205" width="325" height="74"/>
  <text class="label" x="240" y="232" text-anchor="middle">IAM-20680HT IMU</text>
  <text class="small" x="240" y="256" text-anchor="middle">Acceleration / motion sensing</text>
  <text class="tiny" x="240" y="274" text-anchor="middle">I2C0, address 0x69 or 0x68</text>

  <rect class="sensor" x="78" y="310" width="325" height="86"/>
  <text class="label" x="240" y="337" text-anchor="middle">Water Detection Sensors x2</text>
  <text class="small" x="240" y="361" text-anchor="middle">Upper and lower water contact probes</text>
  <text class="tiny" x="240" y="381" text-anchor="middle">GPIO input: PA10 upper, PA11 lower</text>

  <rect class="sensor" x="78" y="428" width="325" height="86"/>
  <text class="label" x="240" y="455" text-anchor="middle">Ultrasonic Distance Sensor</text>
  <text class="small" x="240" y="479" text-anchor="middle">Fish distance / proximity measurement</text>
  <text class="tiny" x="240" y="499" text-anchor="middle">UART1, 9600 baud, GPIO30 TX / GPIO29 RX</text>

  <rect class="sensor" x="78" y="546" width="325" height="86"/>
  <text class="label" x="240" y="573" text-anchor="middle">Temperature / Humidity Sensor</text>
  <text class="small" x="240" y="597" text-anchor="middle">Water/environment telemetry</text>
  <text class="tiny" x="240" y="617" text-anchor="middle">I2C, address 0x70</text>

  <rect class="mcu" x="505" y="225" width="390" height="360"/>
  <text class="whiteLabel" x="700" y="267" text-anchor="middle">Silicon Labs SiWx917</text>
  <text class="whiteSmall" x="700" y="294" text-anchor="middle">BRD2708 / 917 Dev Board</text>

  <rect x="540" y="326" width="320" height="50" rx="10" fill="#1d4d70" stroke="#8ac7ef" stroke-width="1.5"/>
  <text class="whiteSmall" x="700" y="357" text-anchor="middle">ARM Cortex-M4F + FreeRTOS</text>

  <rect x="540" y="394" width="320" height="50" rx="10" fill="#1d4d70" stroke="#8ac7ef" stroke-width="1.5"/>
  <text class="whiteSmall" x="700" y="425" text-anchor="middle">Integrated 2.4 GHz Wi-Fi Radio</text>

  <rect x="540" y="462" width="320" height="76" rx="10" fill="#1d4d70" stroke="#8ac7ef" stroke-width="1.5"/>
  <text class="whiteSmall" x="700" y="492" text-anchor="middle">Peripheral Interfaces</text>
  <text class="whiteSmall" x="700" y="516" text-anchor="middle">I2C, UART, GPIO, Watchdog</text>

  <rect class="section" x="960" y="120" width="398" height="600"/>
  <text class="label" x="984" y="154">Outputs and Network</text>
  <text class="tiny" x="984" y="176">Actuation, dashboard control, and OTA update path</text>

  <rect class="actuator" x="996" y="205" width="325" height="86"/>
  <text class="label" x="1158" y="232" text-anchor="middle">Lure Actuator</text>
  <text class="small" x="1158" y="256" text-anchor="middle">Motor / attraction output</text>
  <text class="tiny" x="1158" y="276" text-anchor="middle">GPIO output: PA56 motor</text>

  <rect class="actuator" x="996" y="320" width="325" height="86"/>
  <text class="label" x="1158" y="347" text-anchor="middle">Status LED</text>
  <text class="small" x="1158" y="371" text-anchor="middle">Local lure/status indicator</text>
  <text class="tiny" x="1158" y="391" text-anchor="middle">GPIO output: PA9 LED</text>

  <rect class="cloud" x="996" y="438" width="325" height="100"/>
  <text class="label" x="1158" y="466" text-anchor="middle">Azure VM MQTT Broker</text>
  <text class="small" x="1158" y="490" text-anchor="middle">20.230.132.231:1883</text>
  <text class="tiny" x="1158" y="513" text-anchor="middle">Telemetry up, control/update command down</text>

  <rect class="cloud" x="996" y="570" width="325" height="96"/>
  <text class="label" x="1158" y="598" text-anchor="middle">Node-RED Dashboard</text>
  <text class="small" x="1158" y="622" text-anchor="middle">Live status, graphs, and controls</text>
  <text class="tiny" x="1158" y="644" text-anchor="middle">HTTP UI on Azure VM</text>

  <rect class="cloud" x="525" y="660" width="350" height="76"/>
  <text class="label" x="700" y="690" text-anchor="middle">HTTP OTA Firmware Server</text>
  <text class="small" x="700" y="714" text-anchor="middle">Downloads wifi_http_otaf_soc.rps</text>

  <rect class="power" x="80" y="766" width="300" height="78"/>
  <text class="label" x="230" y="795" text-anchor="middle">Power Source</text>
  <text class="small" x="230" y="819" text-anchor="middle">USB / battery supply to dev board</text>

  <rect class="power" x="510" y="766" width="380" height="78"/>
  <text class="label" x="700" y="795" text-anchor="middle">Debug and Programming</text>
  <text class="small" x="700" y="819" text-anchor="middle">J-Link / SWD, serial debug output</text>

  <rect class="note" x="990" y="766" width="335" height="78"/>
  <text class="label" x="1158" y="795" text-anchor="middle">Shared Ground / Logic Power</text>
  <text class="small" x="1158" y="819" text-anchor="middle">Sensors and actuators reference MCU GND</text>

  <path class="wire" d="M 403 242 C 454 242, 454 300, 505 300"/>
  <text class="tiny" x="448" y="230" text-anchor="middle">I2C0</text>

  <path class="wire" d="M 403 353 C 454 353, 454 390, 505 390"/>
  <text class="tiny" x="451" y="345" text-anchor="middle">GPIO inputs</text>

  <path class="wire" d="M 403 471 C 454 471, 454 465, 505 465"/>
  <text class="tiny" x="454" y="492" text-anchor="middle">UART1</text>

  <path class="wire" d="M 403 589 C 454 589, 454 530, 505 530"/>
  <text class="tiny" x="449" y="614" text-anchor="middle">I2C</text>

  <path class="wire" d="M 895 248 C 925 248, 948 248, 996 248"/>
  <text class="tiny" x="945" y="235" text-anchor="middle">GPIO</text>

  <path class="wire" d="M 895 363 C 925 363, 948 363, 996 363"/>
  <text class="tiny" x="945" y="350" text-anchor="middle">GPIO</text>

  <path class="wifi" d="M 895 420 C 930 420, 952 488, 996 488"/>
  <text class="tiny" x="943" y="436" text-anchor="middle">Wi-Fi + MQTT</text>

  <path class="wifi" d="M 1158 538 C 1158 550, 1158 558, 1158 570"/>
  <text class="tiny" x="1245" y="558" text-anchor="middle">Dashboard traffic</text>

  <path class="wifi" d="M 875 698 C 930 698, 930 618, 996 618"/>
  <text class="tiny" x="938" y="681" text-anchor="middle">HTTP OTA</text>

  <path class="wire" d="M 380 805 C 450 805, 450 585, 620 585"/>
  <text class="tiny" x="442" y="786" text-anchor="middle">Power</text>

  <path class="wire" d="M 700 766 C 700 708, 700 640, 700 585"/>
  <text class="tiny" x="752" y="752" text-anchor="middle">SWD / serial</text>

  <path class="wire" d="M 990 805 C 932 805, 895 670, 812 585"/>
  <text class="tiny" x="934" y="787" text-anchor="middle">GND / VCC rails</text>

  <text class="tiny" x="700" y="874" text-anchor="middle">Figure 1.1. Hardware setup for the integrated CyberRod IoT device.</text>
</svg>
